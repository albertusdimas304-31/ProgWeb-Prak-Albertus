<!DOCTYPE html>
<html>

<head>
    <title>2473031-Albertus Dimas Dwi Andriyanto</title>

    <script src="jquery-4.0.0.min.js"></script>

    <style>
        body {
            font-family:'Times New Roman', Times, serif;
            margin: 25px;
        }

        table {
            border-collapse: collapse;
        }

        td {
            width: 45px;
            text-align: center;
            padding: 8px;
        }

        hr {
            margin: 6px 0;
        }
    </style>
</head>

<body>

    <table border="1">

        <tr>
            <td>

                <!-- Checkbox utama -->
                <input type="checkbox" id="pilihSemua">

                <hr>

                <!-- Checkbox isi -->
                <input type="checkbox" class="item"><br>
                <input type="checkbox" class="item"><br>
                <input type="checkbox" class="item"><br>
                <input type="checkbox" class="item"><br>

            </td>
        </tr>

    </table>

    <script>

        $(function () {

            $("#pilihSemua").change(function () {

                let status = $(this).is(":checked");

                $(".item").each(function () {

                    $(this).prop("checked", status);

                });

            });

        });

    </script>

</body>

</html>
